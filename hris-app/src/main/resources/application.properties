spring.application.name=hris
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.timeout=${HRIS_SESSION_IDLE_TIMEOUT:30m}
hris.security.max-failed-attempts=${HRIS_MAX_FAILED_ATTEMPTS:5}
hris.security.lock-duration=${HRIS_LOCK_DURATION:PT15M}
hris.security.reauthentication-window=${HRIS_REAUTHENTICATION_WINDOW:PT5M}
# External restricted binary 32-byte AES key. Empty disables enrollment; no built-in secret.
hris.security.mfa-key-file=${HRIS_MFA_KEY_FILE:}
hris.security.mfa-skew-steps=${HRIS_MFA_SKEW_STEPS:1}
hris.security.mfa-enrollment-window=${HRIS_MFA_ENROLLMENT_WINDOW:PT10M}
hris.security.mfa-recovery-count=${HRIS_MFA_RECOVERY_COUNT:10}
