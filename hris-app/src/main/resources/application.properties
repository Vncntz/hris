spring.application.name=hris
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.timeout=${HRIS_SESSION_IDLE_TIMEOUT:30m}
hris.security.max-failed-attempts=${HRIS_MAX_FAILED_ATTEMPTS:5}
hris.security.lock-duration=${HRIS_LOCK_DURATION:PT15M}
